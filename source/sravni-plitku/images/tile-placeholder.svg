<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#F0EEE9"/>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <!-- tile grid pattern -->
  <line x1="100" y1="0" x2="100" y2="200" stroke="#E0DDD8" stroke-width="1.5"/>
  <line x1="0" y1="100" x2="200" y2="100" stroke="#E0DDD8" stroke-width="1.5"/>
  <line x1="50" y1="0" x2="50" y2="200" stroke="#E8E6E2" stroke-width="0.5"/>
  <line x1="150" y1="0" x2="150" y2="200" stroke="#E8E6E2" stroke-width="0.5"/>
  <line x1="0" y1="50" x2="200" y2="50" stroke="#E8E6E2" stroke-width="0.5"/>
  <line x1="0" y1="150" x2="200" y2="150" stroke="#E8E6E2" stroke-width="0.5"/>
  <!-- camera icon -->
  <rect x="72" y="82" width="56" height="42" rx="5" fill="none" stroke="#C8C4BC" stroke-width="2"/>
  <circle cx="100" cy="103" r="10" fill="none" stroke="#C8C4BC" stroke-width="2"/>
  <rect x="88" y="78" width="24" height="8" rx="3" fill="none" stroke="#C8C4BC" stroke-width="1.5"/>
  <!-- text -->
  <text x="100" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#AAAAB0" letter-spacing="0.5">Фото скоро</text>
</svg>
